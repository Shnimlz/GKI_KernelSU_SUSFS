name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_ZRAM_WRITEBACK=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"

    - name: Guard F2FS swapfile readahead (Sleep of Death fix)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        python3 -c '
        import os
        path = "fs/f2fs/file.c"
        if os.path.exists(path):
            with open(path, "r") as f:
                c = f.read()
            if "f2fs_file_fadvise" in c and "IS_SWAPFILE(inode)" not in c:
                idx = c.find("f2fs_file_fadvise")
                target = "struct inode *inode = file_inode(filp);"
                pos = c.find(target, idx)
                if pos != -1:
                    ins = "\n\tif (IS_SWAPFILE(inode))\n\t\treturn -EINVAL;"
                    c = c[:pos + len(target)] + ins + c[pos + len(target):]
                    with open(path, "w") as f:
                        f.write(c)
                    print("Patched f2fs_file_fadvise with IS_SWAPFILE guard.")
        '
          